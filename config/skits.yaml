# Offline कॉमेडी बैंक — जब Gemini (फ्री AI) की key न हो या इंटरनेट AI फेल हो,
# तब एजेंट इन्हीं में से रोज़ एक नया स्किट चुनता है (दिन के हिसाब से, रिपीट नहीं)।
# speaker: wala | pappu | bijli      emotion: normal | happy | shocked | angry | sad
# आप जितने चाहें उतने स्किट जोड़ सकते हैं।

skits:
  - title: "पप्पू की खदान"
    lines:
      - [pappu, shocked, "भैया! मैंने सुना है बिटकॉइन माइनिंग करनी है... फावड़ा कहाँ मिलेगा?"]
      - [wala, shocked, "फावड़ा? अरे पप्पू, ये कोयले की खदान नहीं है!"]
      - [pappu, normal, "तो फिर खोदेंगे कैसे? हेलमेट तो ले आया मैं!"]
      - [wala, happy, "यहाँ खुदाई मशीन करती है, बिजली से, कंप्यूटर के अंदर!"]
      - [pappu, happy, "मतलब हेलमेट वापस कर दूँ?"]
      - [wala, happy, "हेलमेट रख ले, मशीन हम से ले जा!"]

  - title: "AC वाला गलतफहमी"
    lines:
      - [pappu, happy, "भैया, ये मशीन तो बहुत हवा फेंकती है! गर्मी में AC बचेगा!"]
      - [wala, shocked, "ये पंखा मशीन को ठंडा रखने के लिए है, तुझे नहीं!"]
      - [pappu, sad, "मतलब मशीन की ज़िंदगी मुझसे अच्छी है?"]
      - [wala, happy, "मशीन काम करती है पप्पू, तू सिर्फ़ सोता है!"]
      - [pappu, angry, "ठीक है, मैं भी मशीन ही बन जाता हूँ!"]
      - [wala, happy, "तू रहने दे, असली मशीन देसी माइनिंग वाला से ले ले!"]

  - title: "रिश्ते वाली आंटी"
    lines:
      - [pappu, sad, "भैया, लड़की वालों ने पूछा लड़का क्या करता है।"]
      - [wala, normal, "तो तूने क्या बोला?"]
      - [pappu, happy, "मैंने बोला, लड़का रात भर जागकर माइनिंग करता है!"]
      - [wala, shocked, "फिर?"]
      - [pappu, sad, "वो बोले, खदान में काम करता है? रिश्ता कैंसिल!"]
      - [wala, happy, "अगली बार बोलना, लड़के की मशीन रात भर जागती है, लड़का आराम से सोता है!"]

  - title: "बिजली वाले अंकल"
    lines:
      - [bijli, angry, "ये मीटर इतना तेज़ क्यों भाग रहा है? कौन सा कारखाना चल रहा है?"]
      - [pappu, shocked, "अंकल, कारखाना नहीं... डिजिटल सोने की फैक्ट्री!"]
      - [bijli, angry, "सोना? मुझे तो सिर्फ़ बिल दिख रहा है!"]
      - [wala, happy, "इसीलिए तो कहता हूँ, सही मशीन लो, कम बिजली में ज़्यादा काम!"]
      - [bijli, normal, "अच्छा? तो एक मेरे लिए भी देख लेना।"]
      - [wala, happy, "अंकल भी कस्टमर बन गए! देसी माइनिंग वाला ज़िंदाबाद!"]

  - title: "बिटकॉइन की फोटो"
    lines:
      - [pappu, normal, "भैया, बिटकॉइन दिखा दो एक बार, असली वाला सिक्का।"]
      - [wala, happy, "पप्पू, बिटकॉइन डिजिटल है, जेब में नहीं आता।"]
      - [pappu, shocked, "तो फिर मंदिर में चढ़ाऊँगा कैसे?"]
      - [wala, shocked, "भगवान का तो पता नहीं, पर वॉलेट में रखेगा!"]
      - [pappu, happy, "वॉलेट तो मेरे पास है, पर खाली है।"]
      - [wala, happy, "इसीलिए तो कहता हूँ, सोचो, समझो, फिर मशीन देसी माइनिंग वाला से लो!"]

  - title: "मम्मी का कंट्रोल"
    lines:
      - [pappu, sad, "भैया, मम्मी ने मशीन बंद कर दी, बोली इसमें से आवाज़ आती है।"]
      - [wala, shocked, "अरे! तूने बताया नहीं कि ये क्या करती है?"]
      - [pappu, normal, "बताया, बोला ये बिटकॉइन बनाती है।"]
      - [wala, normal, "फिर?"]
      - [pappu, sad, "मम्मी बोली, बनाती है तो रोटी भी बना दे!"]
      - [wala, happy, "रोटी नहीं बनाती, पर सेटअप सही हो तो शांति से चलती है। सही सेटअप के लिए, देसी माइनिंग वाला!"]

  - title: "WhatsApp यूनिवर्सिटी"
    lines:
      - [pappu, happy, "भैया, WhatsApp पर आया है, मोबाइल से बिटकॉइन माइनिंग करो, हर रोज़ लाखों!"]
      - [wala, angry, "पप्पू! ऐसे मैसेज पे भरोसा करेगा तो फ़ोन भी जाएगा और पैसे भी!"]
      - [pappu, shocked, "तो असली माइनिंग कैसे होती है?"]
      - [wala, normal, "असली ASIC मशीन, सही बिजली, सही जगह और पूरी जानकारी के साथ।"]
      - [pappu, happy, "और जानकारी कहाँ मिलेगी?"]
      - [wala, happy, "यहीं, देसी माइनिंग वाला पर! फ़र्ज़ी स्कीम से दूर रहो!"]

  - title: "जिम वाला पप्पू"
    lines:
      - [pappu, happy, "भैया, आज से मैं भी माइनर हूँ! रोज़ सुबह पाँच बजे उठूँगा!"]
      - [wala, normal, "क्यों भाई? माइनिंग तो मशीन करती है।"]
      - [pappu, shocked, "तो मैं क्या करूँ?"]
      - [wala, happy, "तू बस मशीन को ठंडी जगह रख, और आराम कर।"]
      - [pappu, happy, "ये तो मेरा सपनों वाला काम है!"]
      - [wala, happy, "सपने वाला काम, असली मशीन के साथ, देसी माइनिंग वाला से!"]

  - title: "पड़ोसी की जलन"
    lines:
      - [pappu, angry, "भैया, पड़ोसी शर्मा जी बोलते हैं, ये मशीन तो बस शोर करती है।"]
      - [wala, happy, "शर्मा जी के घर का कुकर भी तो सीटी मारता है!"]
      - [pappu, happy, "हाँ, पर उनका कुकर तो सिर्फ़ दाल बनाता है।"]
      - [wala, happy, "और अपनी मशीन हैश बनाती है, बिना रुके, चौबीस घंटे!"]
      - [pappu, shocked, "हैश? वो कौन सी सब्ज़ी है?"]
      - [wala, happy, "सब्ज़ी नहीं, कंप्यूटिंग पावर! समझना है तो DM करो, देसी माइनिंग वाला!"]

  - title: "दिवाली की सफ़ाई"
    lines:
      - [pappu, sad, "भैया, दिवाली की सफ़ाई में मम्मी ने मशीन को कबाड़ी को बेच दिया!"]
      - [wala, shocked, "क्या? कितने में?"]
      - [pappu, sad, "दो सौ रुपये और एक प्लास्टिक की बाल्टी।"]
      - [wala, angry, "पप्पू! वो बाल्टी अब दुनिया की सबसे महँगी बाल्टी है!"]
      - [pappu, normal, "अब क्या करूँ भैया?"]
      - [wala, happy, "नई मशीन ले, और इस बार उस पे लिख देना, बेचना मना है! देसी माइनिंग वाला!"]

  - title: "हैकर पप्पू"
    lines:
      - [pappu, happy, "भैया, मैंने काला चश्मा पहन लिया, अब मैं हैकर हूँ, बिटकॉइन निकालूँगा!"]
      - [wala, shocked, "चश्मे से बिटकॉइन नहीं निकलता, धूप से आँख बचती है!"]
      - [pappu, sad, "तो फिर हुडी वाली फोटो भी बेकार गई?"]
      - [wala, happy, "फोटो अच्छी है, पर माइनिंग के लिए मशीन चाहिए, मेहनत नहीं!"]
      - [pappu, happy, "बिना मेहनत वाला काम? मैं तैयार हूँ!"]
      - [wala, happy, "थोड़ी समझ ज़रूरी है, वो हम देंगे! देसी माइनिंग वाला!"]

  - title: "ससुराल में इंप्रेशन"
    lines:
      - [pappu, normal, "भैया, ससुराल जा रहा हूँ, कुछ ऐसा बोलूँ कि इंप्रेशन जम जाए।"]
      - [wala, happy, "बोलना, मेरे घर में मेरी अपनी डिजिटल माइन है!"]
      - [pappu, shocked, "वाह! और अगर उन्होंने देखने को बोला?"]
      - [wala, normal, "तो मशीन दिखा देना, बत्ती जलती हुई, पंखा घूमता हुआ।"]
      - [pappu, sad, "पर मेरे पास तो मशीन है ही नहीं!"]
      - [wala, happy, "तो पहले देसी माइनिंग वाला से मशीन ले, फिर ससुराल जा!"]
